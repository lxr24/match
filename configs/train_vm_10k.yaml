mode: train
training_stage: vm

model:
  frame_knn: 32
  feat_embedding_dim: 256
  decoder_hidden_dim: 64
  dsm_sigma: 0.01
  num_train_points: 1000
  num_modules: 2

data:
  input_dataset_dir: ./dataset_clean
  datalist: ./datalist/train_strat10k_seed123.txt
  use_prob: true
  num_files: 10000
  num_samples: 32768
  num_vertex_samples: 1024
  num_patches: 4
  patch_size: 1000
  batch_size: 4

optimizer:
  lr: 0.0001

trainer:
  epochs: 3
  max_grad_norm: 1.0
  exp_dir: ./experiments/straightpcf_vm_short10k_s123

predict:
  predict_patch_size: 1000
  predict_seed_k: 6
  predict_inner_steps: 2
  predict_step_scale: 1.0
